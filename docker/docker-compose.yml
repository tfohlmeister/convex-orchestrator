name: convex-orchestrator

services:
  orchestrator:
    # Default path pulls the published image from GHCR. Pin a specific
    # release by setting ORCHESTRATOR_VERSION=0.1.0 in .env, or leave it
    # unset to track :latest. Contributors building from source layer
    # docker-compose.dev.yml on top (it adds `build:` against the local
    # Dockerfile and tags the result with the same image name).
    image: ghcr.io/tfohlmeister/convex-orchestrator:${ORCHESTRATOR_VERSION:-latest}
    container_name: orchestrator
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ORCHESTRATOR_MASTER_KEY: ${ORCHESTRATOR_MASTER_KEY}
      ORCHESTRATOR_ADMIN_TOKEN: ${ORCHESTRATOR_ADMIN_TOKEN}
      # Cluster URL has NO db name path: each backend appends the database
      # named after its instance. The admin URL is what the orchestrator uses
      # to create and drop those databases. See docs/architecture.md
      # § Design decisions worth knowing.
      POSTGRES_CLUSTER_URL: postgres://convex:${POSTGRES_PASSWORD}@postgres:5432
      POSTGRES_ADMIN_URL: postgres://convex:${POSTGRES_PASSWORD}@postgres:5432/postgres
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TRAEFIK_DYNAMIC_PATH: /etc/traefik/dynamic/orchestrator.yml
      # Resolver name written into each router's `tls.certresolver`. The
      # default matches the bundled traefik service below. Co-hosted deploys
      # set this in .env to the existing Traefik's resolver name; an
      # explicitly empty value writes `tls: {}` (Traefik's default cert).
      TRAEFIK_CERT_RESOLVER: ${TRAEFIK_CERT_RESOLVER-letsencrypt}
      TRAEFIK_SERVICE_LOOPBACK: orchestrator
      # Each supervised convex-backend listens on 0.0.0.0 so Traefik (a
      # separate container on the same docker bridge network) can reach
      # it via `orchestrator:<port>`. This is NOT exposed to the host:
      # the orchestrator service has no `ports:` mapping, so the only
      # things that can hit these ports are sibling containers on the
      # same compose network (traefik, postgres, minio). External
      # traffic always comes in through Traefik's host-routed 80/443.
      # For a bare-metal single-process layout (no docker), leave
      # CONVEX_BIND_ADDRESS unset and it falls back to 127.0.0.1.
      CONVEX_BIND_ADDRESS: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # ---- Tunables (optional, set in .env; defaults match the app) ----
      # See docs/backups.md § Scheduling and docker/.env.example for what
      # each knob does. They must be listed here to reach the container:
      # docker compose only uses .env for ${...} interpolation, it does
      # not forward arbitrary .env keys into the environment.
      BACKUP_SCHEDULER_ENABLED: ${BACKUP_SCHEDULER_ENABLED:-true}
      BACKUP_DEFAULT_CRON: ${BACKUP_DEFAULT_CRON:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MAX_CONCURRENT: ${BACKUP_MAX_CONCURRENT:-2}
      BACKUP_EXPORT_TIMEOUT_MINUTES: ${BACKUP_EXPORT_TIMEOUT_MINUTES:-30}
      BACKUP_MAX_CONSECUTIVE_FAILURES: ${BACKUP_MAX_CONSECUTIVE_FAILURES:-3}
      BACKUP_RETENTION_HOUR: ${BACKUP_RETENTION_HOUR:-4}
      EXPORT_BLOB_CLEANUP_INTERVAL_MS: ${EXPORT_BLOB_CLEANUP_INTERVAL_MS:-3600000}
      EXPORT_BLOB_CLEANUP_MIN_AGE_MS: ${EXPORT_BLOB_CLEANUP_MIN_AGE_MS:-900000}
      RESTART_SCHEDULER_ENABLED: ${RESTART_SCHEDULER_ENABLED:-true}
      RESTART_DEFAULT_CRON: ${RESTART_DEFAULT_CRON:-0 4 * * *}
      STORAGE_SAMPLE_INTERVAL_MS: ${STORAGE_SAMPLE_INTERVAL_MS:-300000}
      STORAGE_SCAN_PAGE_LIMIT: ${STORAGE_SCAN_PAGE_LIMIT:-100}
    volumes:
      - orchestrator-data:/var/lib/orchestrator
      - convex-logs:/var/log/convex
      - traefik-dynamic:/etc/traefik/dynamic
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      init-traefik-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 3s
      start_period: 10s
    labels:
      # The orchestrator serves BOTH its own UI (host `orchestrator.<base>`)
      # AND the bundled Convex dashboard static export (host
      # `dashboard.<base>`) from the same Hono process via host-header
      # routing. No separate dashboard container needed; see
      # docs/architecture.md § Design decisions worth knowing.
      traefik.enable: 'true'
      traefik.http.services.orchestrator.loadbalancer.server.port: '8080'
      traefik.http.routers.orchestrator.rule: Host(`orchestrator.${BASE_DOMAIN}`)
      traefik.http.routers.orchestrator.entrypoints: websecure
      traefik.http.routers.orchestrator.tls.certresolver: letsencrypt
      traefik.http.routers.orchestrator.service: orchestrator
      traefik.http.routers.dashboard.rule: Host(`dashboard.${BASE_DOMAIN}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard.service: orchestrator

  postgres:
    image: postgres:16
    container_name: orchestrator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: convex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convex -d convex']
      interval: 10s
      timeout: 5s
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: orchestrator-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 3s
      start_period: 10s

  # One-shot ownership fixup for the shared Traefik dynamic-config volume.
  # The orchestrator runs as non-root (uid 1000) since 0.2.3, but Docker
  # creates the named `traefik-dynamic` volume root-owned on a fresh install.
  # Without this, the orchestrator cannot write its router files
  # (self.yml / orchestrator.yml) into the volume and crash-loops on
  # EACCES; Traefik then has no routes and every host returns 404. This
  # container chowns the volume to the orchestrator's uid, then exits; the
  # orchestrator waits for it via `service_completed_successfully`. The
  # chown is idempotent, so it also repairs volumes from pre-fix installs
  # on the next `up`. Reuses the postgres image (already pulled) to avoid
  # an extra download. Not needed in the co-hosted overlay, which bind-mounts
  # an already-writable host dir instead (see docker-compose.cohosted.yml).
  init-traefik-perms:
    image: postgres:16
    container_name: orchestrator-init-traefik-perms
    entrypoint: ['chown', '-R', '1000:1000', '/etc/traefik/dynamic']
    restart: 'no'
    volumes:
      - traefik-dynamic:/etc/traefik/dynamic

  traefik:
    image: traefik:v3.5
    container_name: orchestrator-traefik
    restart: unless-stopped
    command:
      # Docker provider disabled — Traefik's docker client uses an API
      # version that Docker daemon 29.x rejects (1.24 < 1.40 minimum).
      # All routes (per-instance + orchestrator-self) come from the file
      # provider; the orchestrator writes both files into the shared volume.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${DNS_PROVIDER}
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Recent Docker daemons (29.x+) require API >= 1.40 from clients;
      # without this Traefik defaults to an ancient version and the daemon
      # refuses the connection.
      DOCKER_API_VERSION: '1.45'
      # Pass your DNS provider's required env vars here from the host .env file.
      # See https://doc.traefik.io/traefik/https/acme/#providers for the full list.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      GANDI_API_KEY: ${GANDI_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-dynamic:/etc/traefik/dynamic
      - traefik-acme:/etc/traefik

volumes:
  orchestrator-data:
  convex-logs:
  postgres-data:
  minio-data:
  traefik-dynamic:
  traefik-acme:
