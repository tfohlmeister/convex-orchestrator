name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: convex-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build orchestrator image (amd64 only for tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: convex-orchestrator:test

      - name: Run smoke test
        run: |
          docker run -d --name orch \
            -e ORCHESTRATOR_MASTER_KEY=$(openssl rand -hex 32) \
            -e ORCHESTRATOR_ADMIN_TOKEN=$(openssl rand -hex 32) \
            -e BASE_DOMAIN=cvx.local \
            -p 8080:8080 \
            convex-orchestrator:test
          sleep 10
          curl -fsS http://localhost:8080/healthz
          docker logs orch
          docker rm -f orch
