<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(11,13,11,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#52534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f7591f"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f4ed"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <!-- Transitions -->
  <line x1="84" y1="220" x2="156" y2="220" stroke="#52534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="92" y="206" width="60" height="12" rx="2" fill="#f5f4ed"/>
  <text x="122" y="215" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /api</text>

  <line x1="316" y1="220" x2="396" y2="220" stroke="#52534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="324" y="194" width="72" height="20" rx="2" fill="#f5f4ed"/>
  <text x="360" y="203" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">spawn OK</text>
  <text x="360" y="212" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">+ traefik.set</text>

  <path d="M 236 260 Q 236 360 396 380" stroke="#f7591f" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
  <rect x="208" y="310" width="120" height="20" rx="2" fill="#f5f4ed"/>
  <text x="268" y="319" fill="#f7591f" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">spawn throws</text>
  <text x="268" y="328" fill="#f7591f" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">→ status=error</text>

  <line x1="556" y1="208" x2="636" y2="208" stroke="#52534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="572" y="194" width="48" height="12" rx="2" fill="#f5f4ed"/>
  <text x="596" y="203" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/stop</text>

  <line x1="636" y1="232" x2="556" y2="232" stroke="#52534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="572" y="234" width="48" height="12" rx="2" fill="#f5f4ed"/>
  <text x="596" y="243" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/start</text>

  <path d="M 440 196 Q 440 140 488 140 Q 536 140 504 196" stroke="#52534e" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <rect x="412" y="120" width="160" height="12" rx="2" fill="#f5f4ed"/>
  <text x="492" y="129" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/force-restart-backend</text>

  <line x1="476" y1="260" x2="476" y2="356" stroke="#f7591f" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="396" y="296" width="160" height="20" rx="2" fill="#f5f4ed"/>
  <text x="476" y="305" fill="#f7591f" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MAX_RESTARTS in 10min</text>
  <text x="476" y="314" fill="#f7591f" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">→ give-up</text>

  <path d="M 556 388 Q 716 388 716 260" stroke="#52534e" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow)"/>
  <rect x="592" y="378" width="156" height="12" rx="2" fill="#f5f4ed"/>
  <text x="670" y="387" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">operator restores / fixes</text>

  <line x1="556" y1="220" x2="888" y2="220" stroke="#52534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="800" y="206" width="92" height="12" rx="2" fill="#f5f4ed"/>
  <text x="846" y="215" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DELETE · confirm</text>

  <path d="M 796 240 Q 868 240 904 232" stroke="#52534e" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow)"/>

  <!-- Start dot -->
  <circle cx="76" cy="220" r="6" fill="#0b0d0b"/>
  <text x="76" y="252" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">start</text>

  <!-- End dot -->
  <circle cx="912" cy="220" r="8" fill="none" stroke="#0b0d0b" stroke-width="1.2"/>
  <circle cx="912" cy="220" r="5" fill="#0b0d0b"/>
  <text x="912" y="252" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">destroyed</text>

  <!-- States -->
  <rect x="156" y="180" width="160" height="80" rx="8" fill="#f5f4ed"/>
  <rect x="156" y="180" width="160" height="80" rx="8" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
  <rect x="164" y="186" width="56" height="12" rx="2" fill="transparent" stroke="rgba(11,13,11,0.40)" stroke-width="0.8"/>
  <text x="192" y="195" fill="rgba(11,13,11,0.75)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">ENTRY</text>
  <text x="236" y="226" fill="#0b0d0b" font-size="13" font-weight="600" text-anchor="middle">creating</text>
  <text x="236" y="244" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">gen key · alloc ports · buckets · spawn</text>

  <rect x="396" y="180" width="160" height="80" rx="8" fill="#f5f4ed"/>
  <rect x="396" y="180" width="160" height="80" rx="8" fill="#ffffff" stroke="#0b0d0b" stroke-width="1"/>
  <rect x="404" y="186" width="56" height="12" rx="2" fill="transparent" stroke="rgba(11,13,11,0.40)" stroke-width="0.8"/>
  <text x="432" y="195" fill="rgba(11,13,11,0.75)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">ACTIVE</text>
  <text x="476" y="226" fill="#0b0d0b" font-size="13" font-weight="600" text-anchor="middle">running</text>
  <text x="476" y="244" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">supervised · route attached</text>

  <rect x="636" y="180" width="160" height="80" rx="8" fill="#f5f4ed"/>
  <rect x="636" y="180" width="160" height="80" rx="8" fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <rect x="644" y="186" width="48" height="12" rx="2" fill="transparent" stroke="rgba(82,83,78,0.40)" stroke-width="0.8"/>
  <text x="668" y="195" fill="rgba(82,83,78,0.90)" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">IDLE</text>
  <text x="716" y="226" fill="#0b0d0b" font-size="13" font-weight="600" text-anchor="middle">stopped</text>
  <text x="716" y="244" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">no process · no route</text>

  <rect x="396" y="356" width="160" height="80" rx="8" fill="#f5f4ed"/>
  <rect x="396" y="356" width="160" height="80" rx="8" fill="rgba(247,89,31,0.08)" stroke="#f7591f" stroke-width="1"/>
  <rect x="404" y="362" width="56" height="12" rx="2" fill="transparent" stroke="rgba(247,89,31,0.55)" stroke-width="0.8"/>
  <text x="432" y="371" fill="#f7591f" font-size="7" font-family="ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">FAILED</text>
  <text x="476" y="402" fill="#0b0d0b" font-size="13" font-weight="600" text-anchor="middle">error</text>
  <text x="476" y="420" fill="#65655c" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">last_error stored · UI surfaces it</text>

  <!-- Legend -->
  <line x1="32" y1="500" x2="1048" y2="500" stroke="rgba(11,13,11,0.10)" stroke-width="0.8"/>
  <text x="32" y="518" fill="#52534e" font-size="8" font-family="ui-monospace, monospace" letter-spacing="0.16em">LEGEND</text>
  <rect x="116" y="510" width="14" height="10" rx="2" fill="rgba(247,89,31,0.08)" stroke="#f7591f" stroke-width="1"/>
  <text x="136" y="518" fill="#52534e" font-size="9" font-family="ui-monospace, monospace">focal state · the one to notice</text>
  <line x1="392" y1="514" x2="424" y2="514" stroke="#52534e" stroke-width="1"/>
  <text x="430" y="518" fill="#52534e" font-size="9" font-family="ui-monospace, monospace">operator transition</text>
  <line x1="572" y1="514" x2="604" y2="514" stroke="#f7591f" stroke-width="1.4"/>
  <text x="610" y="518" fill="#52534e" font-size="9" font-family="ui-monospace, monospace">failure transition</text>
  <line x1="752" y1="514" x2="784" y2="514" stroke="#52534e" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="790" y="518" fill="#52534e" font-size="9" font-family="ui-monospace, monospace">terminal · recovery</text>
</svg>
